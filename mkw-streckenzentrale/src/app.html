<title>MKW Streckenzentrale</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,500;0,700;0,800;1,800;1,900&family=Nunito+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: App-Shell (Kopfleiste + eine Ansicht). Karte füllt den Rest des Bildschirms; Detail = große Bühne + Seitenleiste. */
:root{
  --sea:#2b78c9; --sea-deep:#1d5ea8; --kart:#e3262f; --kart-dark:#b5161f; --gold:#ffc31f; --gold-deep:#e8a200;
  --ink:#16203a; --ink-soft:#4a5676; --paper:#eef3fa; --card:#ffffff; --line:#d6dfec; --chip:#e4ebf6;
  --good:#1f9d55; --int:#7a3fd1; --snes:#5b5fc7; --main:#e3262f;
  --shadow:0 10px 30px -12px rgba(22,32,58,.35);
  --f-display:"Rubik",system-ui,"Segoe UI",sans-serif; --f-body:"Nunito Sans",system-ui,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#eef2fb; --ink-soft:#a9b5d1; --paper:#0e1528; --card:#18223d; --line:#2a375a; --chip:#222e4f;
  --sea:#2a6db8; --sea-deep:#173f78; --shadow:0 12px 34px -14px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --ink:#eef2fb; --ink-soft:#a9b5d1; --paper:#0e1528; --card:#18223d; --line:#2a375a; --chip:#222e4f;
  --sea:#2a6db8; --sea-deep:#173f78; --shadow:0 12px 34px -14px rgba(0,0,0,.7); color-scheme:dark}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:8px}
.app{height:100%;display:flex;flex-direction:column}

/* ---------- Kopfleiste ---------- */
.top{position:relative;z-index:30;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(100deg,var(--kart) 0%,#f04a2a 100%);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:6px;
  background:repeating-linear-gradient(90deg,#16203a 0 12px,#fff 12px 24px);opacity:.9}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff;margin-right:6px}
.brand svg{flex:none}
.brand b{font-family:var(--f-display);font-style:italic;font-weight:900;font-size:20px;letter-spacing:.2px;line-height:1;text-shadow:0 2px 0 rgba(0,0,0,.18)}
.brand small{display:block;font-family:var(--f-display);font-weight:700;font-size:10px;letter-spacing:1.6px;text-transform:uppercase;opacity:.85}
.nav{display:flex;gap:6px}
.nav a{font-family:var(--f-display);font-weight:800;font-style:italic;font-size:14px;color:#fff;text-decoration:none;padding:7px 14px;border-radius:999px;background:rgba(255,255,255,.14);transition:background .15s,transform .15s}
.nav a:hover{background:rgba(255,255,255,.26);transform:translateY(-1px)}
.nav a[aria-current="page"]{background:#fff;color:var(--kart)}
.search{position:relative;flex:1;min-width:180px;max-width:420px;margin-left:auto}
.search input{width:100%;border:0;border-radius:999px;padding:9px 14px 9px 38px;background:rgba(255,255,255,.95);color:#16203a;font-weight:600}
.search input::placeholder{color:#6a7592}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#6a7592}
.sres{position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--card);color:var(--ink);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;max-height:60vh;overflow-y:auto;border:1px solid var(--line)}
.sres button{display:flex;width:100%;align-items:center;gap:10px;padding:10px 14px;border:0;background:none;text-align:left}
.sres button:hover,.sres button.on{background:var(--chip)}
.sres .empty{padding:14px;color:var(--ink-soft)}
.mini-prog{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:13px;color:#fff;text-decoration:none}
.mini-prog .bar{width:70px;height:8px;border-radius:9px;background:rgba(255,255,255,.3);overflow:hidden}
.mini-prog .bar i{display:block;height:100%;background:var(--gold);border-radius:9px;transition:width .4s}

main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow:auto}

/* ---------- Pills & Chips ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-display);font-weight:800;font-size:11px;letter-spacing:.8px;text-transform:uppercase;padding:3px 9px;border-radius:999px;color:#fff;white-space:nowrap}
.pill.main{background:var(--main)} .pill.int{background:var(--int)} .pill.snes{background:var(--snes)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--chip);color:var(--ink-soft);white-space:nowrap}
.rate-badge{display:inline-grid;place-items:center;min-width:30px;height:24px;padding:0 6px;border-radius:8px;font-family:var(--f-display);font-weight:800;font-size:13px;color:#16203a;background:var(--chip);font-variant-numeric:tabular-nums}
.rate-badge.set{background:var(--gold)}
.won-ico{color:var(--line)} .won-ico.on{color:var(--gold-deep)}

/* ---------- Karte ---------- */
#v-map{overflow:hidden;background:var(--sea-deep)}
#map{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#map.drag{cursor:grabbing}
.mk{cursor:pointer}
.mk .face{transition:transform .18s cubic-bezier(.3,1.6,.5,1)}
.mk:hover .face,.mk.sel .face,.mk:focus-visible .face{transform:scale(1.18)}
.mk:focus{outline:none}
.mk .halo{opacity:0;transition:opacity .2s}
.mk:hover .halo,.mk.sel .halo,.mk:focus-visible .halo{opacity:1}
.mk .lbl{font-family:var(--f-display);font-weight:900;font-style:italic;fill:#16203a;pointer-events:none}
.mk .plate{transition:transform .18s}
.mk:hover .plate rect,.mk.sel .plate rect{fill:#ffd400}
.mk .plate.hov{opacity:0;transition:opacity .2s}.mk:hover .plate.hov,.mk.sel .plate.hov,.mk:focus-visible .plate.hov{opacity:1}
.mk.dim{opacity:.45}
.conn path{fill:none;stroke-linecap:round}
.map-ui{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:5}
.map-ui button{width:44px;height:44px;border-radius:14px;border:0;background:var(--card);color:var(--ink);box-shadow:var(--shadow);font-family:var(--f-display);font-weight:800;font-size:20px;display:grid;place-items:center}
.map-ui button:hover{background:var(--gold);color:#16203a}
.legend{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:5;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(6px);border-radius:16px;padding:10px 14px;box-shadow:var(--shadow);font-size:12px;display:flex;flex-direction:column;gap:5px;max-width:260px}
.legend b{font-family:var(--f-display);font-style:italic;font-size:13px}
.legend span{display:flex;align-items:center;gap:8px}
.legend i{display:inline-block;width:22px;height:0;border-top:3px solid}
.hint{position:absolute;top:18px;left:50%;transform:translateX(-50%);z-index:5;background:var(--card);color:var(--ink);padding:8px 16px;border-radius:999px;box-shadow:var(--shadow);font-weight:700;font-size:13px;white-space:nowrap;pointer-events:none;transition:opacity .4s}

/* ---------- Streckenauswahl (Panel) ---------- */
.panel{position:absolute;z-index:20;top:14px;right:14px;bottom:14px;width:min(420px,calc(100% - 28px));background:var(--card);border-radius:24px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;transform:translateX(calc(100% + 30px));transition:transform .32s cubic-bezier(.2,.9,.25,1.05)}
.panel.open{transform:none}
.p-head{position:relative;padding:20px 20px 16px;color:#fff;overflow:hidden}
.p-head h2{margin:6px 0 4px;font-family:var(--f-display);font-style:italic;font-weight:900;font-size:28px;line-height:1.05;text-wrap:balance;text-shadow:0 2px 0 rgba(0,0,0,.2)}
.p-head .meta{display:flex;flex-wrap:wrap;gap:6px}
.p-head .meta .chip{background:rgba(255,255,255,.22);color:#fff}
.p-close{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:12px;border:0;background:rgba(0,0,0,.2);color:#fff;font-size:20px;display:grid;place-items:center}
.p-body{flex:1;overflow-y:auto;padding:16px 16px 20px;display:flex;flex-direction:column;gap:18px}
.sec-t{font-family:var(--f-display);font-weight:800;font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink-soft);margin:0 0 8px;display:flex;align-items:center;gap:8px}
.vcard{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border-radius:18px;border:2px solid var(--line);background:var(--card);text-align:left;transition:transform .15s,border-color .15s,box-shadow .15s}
.vcard:hover{transform:translateY(-2px);border-color:var(--gold);box-shadow:var(--shadow)}
.vcard .thumb{width:64px;height:48px;border-radius:12px;flex:none;overflow:hidden;background:var(--chip)}
.vcard .thumb svg{width:100%;height:100%;display:block}
.vcard .tx{flex:1;min-width:0}
.vcard .tx b{display:block;font-family:var(--f-display);font-weight:800;font-size:16px;line-height:1.15}
.vcard .tx small{color:var(--ink-soft);font-size:12px}
.vcard .st{display:flex;align-items:center;gap:6px}
.vlist{display:flex;flex-direction:column;gap:8px}
.tabs{display:flex;gap:6px;background:var(--chip);padding:4px;border-radius:14px;margin-bottom:10px}
.tabs button{flex:1;border:0;background:none;padding:7px 8px;border-radius:10px;font-family:var(--f-display);font-weight:800;font-size:13px;color:var(--ink-soft)}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.1)}
.rrow{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:14px;border:0;background:var(--chip);text-align:left;transition:background .15s,transform .15s}
.rrow:hover{background:color-mix(in srgb,var(--int) 16%,var(--chip));transform:translateX(3px)}
.rrow .arrow{color:var(--int);flex:none}
.rrow .nm{flex:1;min-width:0;font-weight:700}
.rrow .nm small{display:block;font-weight:600;color:var(--ink-soft);font-size:12px}
.note-empty{color:var(--ink-soft);font-size:13px;padding:8px 2px}

/* ---------- Detailseite ---------- */
.detail{min-height:100%;display:flex;flex-direction:column;gap:14px;padding-block:16px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.d-head{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.back{border:0;background:var(--card);border-radius:14px;height:44px;padding:0 14px;display:flex;align-items:center;gap:6px;font-family:var(--f-display);font-weight:800;box-shadow:var(--shadow);flex:none}
.back:hover{background:var(--gold);color:#16203a}
.d-title{flex:1;min-width:0}
.d-title h1{margin:4px 0 2px;font-family:var(--f-display);font-style:italic;font-weight:900;font-size:clamp(26px,3.6vw,42px);line-height:1.05;text-wrap:balance}
.d-title p{margin:0;color:var(--ink-soft);font-weight:600}
.d-nav{display:flex;gap:8px}
.d-nav button{width:44px;height:44px;border-radius:14px;border:0;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center}
.d-nav button:hover{background:var(--gold);color:#16203a}
.switch{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.switch .sw{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-family:var(--f-display);font-weight:800;font-size:13px;display:flex;align-items:center;gap:6px;transition:border-color .15s,background .15s}
.switch .sw:hover{border-color:var(--gold)}
.switch .sw[aria-current="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.switch select{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;max-width:100%}
.d-grid{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
.stage{position:relative;background:var(--card);border-radius:26px;box-shadow:var(--shadow);overflow:hidden;min-width:0}
.stage .canvas{aspect-ratio:1000/660;width:100%;max-width:100%;display:grid;place-items:center;background:var(--chip)}
.stage .canvas svg{width:100%;height:100%;display:block}
.stage .canvas img{width:100%;height:100%;object-fit:contain;background:#0b1020}
.stage-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.src-row{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:0 14px 12px;font-size:12px;color:var(--ink-soft)}
.src-row label{font-weight:800;font-family:var(--f-display)}
.src-row input{flex:1;min-width:180px;border:3px solid var(--outline);border-radius:10px;padding:5px 10px;background:var(--paper);font-size:13px}
.src-row span{flex-basis:100%}
.src-row a{color:var(--kart);font-weight:700}
.stage-bar .cap{flex:1;min-width:160px;font-size:12px;color:var(--ink-soft)}
.btn{border:0;border-radius:12px;padding:8px 14px;font-family:var(--f-display);font-weight:800;font-size:13px;background:var(--chip);display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--gold);color:#16203a}
.btn.primary{background:var(--kart);color:#fff}
.btn.primary:hover{background:var(--kart-dark);color:#fff}
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.box{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:16px}
.box h3{margin:0 0 10px;font-family:var(--f-display);font-weight:800;font-size:13px;letter-spacing:1.3px;text-transform:uppercase;color:var(--ink-soft);display:flex;align-items:center;justify-content:space-between;gap:8px}
.score{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.score .big{font-family:var(--f-display);font-style:italic;font-weight:900;font-size:56px;line-height:.9;font-variant-numeric:tabular-nums;color:var(--ink)}
.score .big.none{color:var(--line)}
.score .of{font-family:var(--f-display);font-weight:800;color:var(--ink-soft)}
.score .word{margin-left:auto;font-family:var(--f-display);font-weight:800;font-style:italic;font-size:16px;color:var(--kart)}
.rates{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.rates button{height:42px;border-radius:11px;border:0;font-family:var(--f-display);font-weight:800;font-size:15px;background:var(--chip);color:var(--ink-soft);transition:transform .12s,background .12s;font-variant-numeric:tabular-nums}
.rates button:hover{transform:translateY(-3px)}
.rates button.fill{color:#16203a}
.linkbtn{border:0;background:none;color:var(--ink-soft);font-size:12px;font-weight:700;text-decoration:underline;padding:0}
.win{display:flex;align-items:center;gap:14px;width:100%;border:0;border-radius:18px;padding:14px;background:var(--chip);text-align:left;transition:background .2s}
.win .tro{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:var(--card);color:var(--line);flex:none;transition:transform .3s cubic-bezier(.3,1.8,.5,1),color .2s,background .2s}
.win b{display:block;font-family:var(--f-display);font-weight:900;font-style:italic;font-size:19px}
.win small{color:var(--ink-soft);font-weight:600}
.win .tog{margin-left:auto;width:52px;height:30px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.win .tog::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.win[aria-checked="true"]{background:color-mix(in srgb,var(--gold) 30%,var(--chip))}
.win[aria-checked="true"] .tro{color:#16203a;background:var(--gold);transform:rotate(-8deg) scale(1.05)}
.win[aria-checked="true"] .tog{background:var(--good)}
.win[aria-checked="true"] .tog::after{transform:translateX(22px)}
.notes textarea{width:100%;min-height:230px;resize:vertical;border:2px solid var(--line);border-radius:16px;padding:12px;background:var(--paper);line-height:1.5}
.notes textarea:focus{border-color:var(--gold);outline:none}
.tpl{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.tpl button{border:0;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;background:var(--chip);color:var(--ink-soft)}
.tpl button:hover{background:var(--gold);color:#16203a}
.saved{font-size:12px;font-weight:700;color:var(--good);text-transform:none;letter-spacing:0;transition:opacity .3s}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px}
.facts dt{color:var(--ink-soft);font-weight:700}
.facts dd{margin:0;font-weight:600;min-width:0}

/* ---------- Übersicht ---------- */
.page{max-width:1240px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.page h1{margin:0;font-family:var(--f-display);font-style:italic;font-weight:900;font-size:clamp(28px,4vw,40px);line-height:1.05}
.page .lead{margin:4px 0 0;color:var(--ink-soft);font-weight:600}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--card);padding:10px;border-radius:18px;box-shadow:var(--shadow)}
.seg{display:flex;gap:4px;background:var(--chip);padding:4px;border-radius:12px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 11px;border-radius:9px;font-family:var(--f-display);font-weight:800;font-size:13px;color:var(--ink-soft)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 2px 5px rgba(0,0,0,.1)}
.filters input,.filters select{border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:7px 12px;font-weight:600}
.filters input{flex:1;min-width:160px}
.count{font-size:13px;color:var(--ink-soft);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.cupgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.cup{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:14px}
.cup h3{margin:0 0 10px;font-family:var(--f-display);font-style:italic;font-weight:900;font-size:18px;display:flex;align-items:center;gap:8px}
.cup h3 small{margin-left:auto;font-style:normal;font-size:12px;color:var(--ink-soft)}
.cup ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.cup li button{width:100%;display:flex;align-items:center;gap:8px;border:0;background:var(--chip);border-radius:12px;padding:7px 10px;text-align:left;font-weight:700}
.cup li button:hover{background:color-mix(in srgb,var(--gold) 35%,var(--chip))}
.cup li .n{flex:1;min-width:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.stat{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:8px}
.stat .k{font-family:var(--f-display);font-weight:800;font-size:12px;letter-spacing:1.3px;text-transform:uppercase;color:var(--ink-soft)}
.stat .v{font-family:var(--f-display);font-style:italic;font-weight:900;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.stat .v small{font-size:18px;color:var(--ink-soft);font-style:normal}
.pbar{height:12px;border-radius:99px;background:var(--chip);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:99px;transition:width .5s}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hist{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:10px}
.hist div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;font-size:11px;font-weight:700;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.hist i{display:block;width:100%;border-radius:7px 7px 3px 3px;background:var(--gold);min-height:3px;transition:height .4s}
.toplist{display:flex;flex-direction:column;gap:6px}
.backup textarea{width:100%;min-height:120px;border:2px solid var(--line);border-radius:12px;background:var(--paper);padding:10px;font-family:ui-monospace,monospace;font-size:12px}
.msg{font-size:13px;font-weight:700}
.sync{font-size:12px;color:var(--ink-soft);font-weight:600}

@media (max-width:980px){
  .d-grid{grid-template-columns:1fr}

/* ===== Mario-Kart-World-Stil: Sticker-Flächen, dicke Konturen, harte Schatten, Gelb als Auswahlfarbe ===== */
:root{--outline:#16203a;--hl:#ffd400;--hl-soft:#fff3a6;--stripe:rgba(43,120,201,.07)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--outline:#02040b;--hl-soft:#4a4520;--stripe:rgba(255,255,255,.03)}}
:root[data-theme="dark"]{--outline:#02040b;--hl-soft:#4a4520;--stripe:rgba(255,255,255,.03)}
body{background-color:var(--paper);background-image:repeating-linear-gradient(-45deg,transparent 0 26px,var(--stripe) 26px 52px)}
.top{background:linear-gradient(100deg,#e60012 0%,#ff3b1f 100%);border-bottom:4px solid var(--outline)}
.top::after{bottom:-10px;height:6px}
.brand b{font-size:22px;-webkit-text-stroke:0}
.nav a{transform:skewX(-10deg);border:3px solid var(--outline);background:#fff;color:#16203a;border-radius:12px;box-shadow:0 4px 0 var(--outline);padding:6px 16px}
.nav a:hover{background:var(--hl);transform:skewX(-10deg) translateY(-2px);box-shadow:0 6px 0 var(--outline)}
.nav a[aria-current="page"]{background:var(--hl);color:#16203a}
.search input{border:3px solid var(--outline);box-shadow:0 4px 0 var(--outline)}
.vcard,.box,.stage,.cup,.stat,.filters,.back,.d-nav button,.map-ui button,.legend,.sres,.rrow,.switch .sw,.switch select,.btn,.win{border:3px solid var(--outline);box-shadow:0 5px 0 var(--outline)}
.vcard,.rrow,.cup li button,.btn,.back,.d-nav button,.map-ui button,.switch .sw{transition:transform .12s,box-shadow .12s,background .12s}
.vcard:hover,.rrow:hover,.btn:hover,.back:hover,.d-nav button:hover,.map-ui button:hover,.switch .sw:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--outline);background:var(--hl);color:#16203a;border-color:var(--outline)}
.vcard:active,.rrow:active,.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--outline)}
.vcard:hover small,.rrow:hover small{color:#3a4566}
.switch .sw[aria-current="true"]{background:var(--hl);color:#16203a;border-color:var(--outline)}
.panel{border:4px solid var(--outline);box-shadow:0 8px 0 var(--outline)}
.p-head{border-bottom:4px solid var(--outline)}
.p-head h2,.d-title h1,.page h1{text-transform:none;-webkit-text-stroke:0;letter-spacing:-.5px}
.d-title h1,.page h1{text-shadow:3px 3px 0 var(--hl)}
.sec-t,.box h3,.stat .k{font-style:italic;font-weight:900;color:var(--ink)}
.sec-t::before,.box h3:first-child::before{content:"";width:12px;height:12px;border-radius:3px;background:var(--hl);border:2px solid var(--outline);transform:skewX(-12deg);flex:none}
.pill{border:2px solid var(--outline);font-style:italic;font-weight:900;transform:skewX(-8deg)}
.tabs{border:3px solid var(--outline);background:var(--chip)}
.tabs button[aria-selected="true"]{background:var(--hl);color:#16203a;box-shadow:none}
.seg{border:3px solid var(--outline)}
.seg button[aria-pressed="true"]{background:var(--hl);color:#16203a}
.rates button{border:3px solid var(--outline);box-shadow:0 3px 0 var(--outline)}
.rates button.fill{box-shadow:0 3px 0 var(--outline)}
.rate-badge{border:2px solid var(--outline)}
.rate-badge.set{background:var(--hl)}
.win[aria-checked="true"]{background:var(--hl-soft)}
.win .tro{border:3px solid var(--outline)}
.notes textarea,.filters input,.filters select,.backup textarea{border:3px solid var(--outline)}
.stage .canvas{border-bottom:3px solid var(--outline)}
.stage.drop{outline:5px dashed var(--hl);outline-offset:4px}
.pbar{border:2px solid var(--outline);height:16px}
.hist i{border:2px solid var(--outline)}
.hint{border:3px solid var(--outline);box-shadow:0 4px 0 var(--outline);font-style:italic;font-family:var(--f-display);font-weight:800}
.p-close{border:3px solid #fff}
.cup li button{border:2px solid var(--outline)}
.stage-bar{border-top:0}

<script>
"use strict";
/* =====================================================================
   DATEN
   Positionen: Mittelpunkt jeder Strecke auf der Weltkarte in % (x/y),
   SNES-Zuordnung: Update 1.8.0 (Sept. 2026), Auswahl über die Gastgeberstrecke.
   Intermissions: alle 202 Routen (Start → Ziel, Anzahl Abschnitte).
   ===================================================================== */
const CUPS=[
 {id:"pilz",name:"Pilz-Cup",c:"#e3262f",t:["mario-bros-circuit","crown-city","whistlestop-summit","dk-spaceport"]},
 {id:"blume",name:"Blumen-Cup",c:"#f08a1c",t:["desert-hills","shy-guy-bazaar","wario-stadium","airship-fortress"]},
 {id:"stern",name:"Stern-Cup",c:"#e8b400",t:["dk-pass","starview-peak","sky-high-sundae","wario-shipyard"]},
 {id:"panzer",name:"Panzer-Cup",c:"#1f9d55",t:["koopa-troopa-beach","faraway-oasis","crown-city","peach-stadium"]},
 {id:"banane",name:"Bananen-Cup",c:"#d9b300",t:["peach-beach","salty-salty-speedway","dino-dino-jungle","great-q-block-ruins"]},
 {id:"blatt",name:"Blatt-Cup",c:"#3c9a3c",t:["cheep-cheep-falls","dandelion-depths","boo-cinema","dry-bones-burnout"]},
 {id:"blitz",name:"Blitz-Cup",c:"#7a3fd1",t:["moo-moo-meadows","choco-mountain","toads-factory","bowsers-castle"]},
 {id:"spezial",name:"Spezial-Cup",c:"#2b78c9",t:["acorn-heights","mario-circuit","peach-stadium","rainbow-road"]}
];
const BIOMES={
 volcano:{n:"Vulkanland",g:"#4a3f45",a:"#ff7a2a",d:"#2e272b"},
 forest:{n:"Nordwald",g:"#3f9a45",a:"#2c7a33",d:"#256b2b"},
 snow:{n:"Schneegebirge",g:"#eaf2fa",a:"#9fc3e6",d:"#c9dcef"},
 desert:{n:"Sonnenwüste",g:"#f3b866",a:"#e4943e",d:"#d99a4a"},
 canyon:{n:"Roter Canyon",g:"#d96a3c",a:"#b8502a",d:"#b85631"},
 plains:{n:"Zentrale Ebene",g:"#9ccc45",a:"#6fae2d",d:"#82b53a"},
 autumn:{n:"Herbstwald",g:"#e8823a",a:"#c9572a",d:"#cf6c2e"},
 savanna:{n:"Savanne",g:"#e6cf62",a:"#bfa23a",d:"#cdb24a"},
 jungle:{n:"Südlicher Dschungel",g:"#2f8a45",a:"#1f6b33",d:"#236c36"},
 coast:{n:"Küste & Inseln",g:"#f4e3a6",a:"#2fb3c9",d:"#e6cf86"},
 sky:{n:"Am Himmel",g:"#1b1f4a",a:"#ff5fd2",d:"#14173a"}
};
// id, Name, Kürzel, Biom, x%, y%, Alias für die Suche
const TRACKS=[
 ["mario-bros-circuit","Mario Bros. Circuit","MBC","canyon",23.19,59.43],
 ["crown-city","Crown City","CC","plains",37.88,70.29,"Trophy City"],
 ["whistlestop-summit","Whistlestop Summit","WS","canyon",23.86,79.52],
 ["dk-spaceport","DK Spaceport","DKS","plains",39.34,83.8],
 ["desert-hills","Desert Hills","DH","desert",12.3,69.56],
 ["shy-guy-bazaar","Shy Guy Bazaar","SGB","desert",13.09,50.06],
 ["wario-stadium","Wario Stadium","WSt","canyon",26.25,43.05],
 ["airship-fortress","Airship Fortress","AF","desert",14.88,32.15],
 ["dk-pass","DK Pass","DKP","snow",73.11,43.18,"DK Snow Mountain"],
 ["starview-peak","Starview Peak","SP","snow",73.6,23.9],
 ["sky-high-sundae","Sky-High Sundae","SHS","snow",84.78,34.8],
 ["wario-shipyard","Wario Shipyard","WSY","coast",85.79,54.04,"Wario's Galleon"],
 ["koopa-troopa-beach","Koopa Troopa Beach","KTB","coast",49.89,79.56,"Koopa Beach"],
 ["faraway-oasis","Faraway Oasis","FO","savanna",60.81,68.62],
 ["peach-beach","Peach Beach","PB","coast",85.04,68.75],
 ["salty-salty-speedway","Salty Salty Speedway","SSS","coast",74.2,60.62],
 ["dino-dino-jungle","Dino Dino Jungle","DDJ","jungle",64.66,86.15],
 ["great-q-block-ruins","Great ? Block Ruins","G?B","jungle",76.93,80.5,"Great Question Block Ruins"],
 ["cheep-cheep-falls","Cheep Cheep Falls","CCF","autumn",62.79,51.86],
 ["dandelion-depths","Dandelion Depths","DD","autumn",61.97,36.81],
 ["boo-cinema","Boo Cinema","BC","forest",63.43,17.44],
 ["dry-bones-burnout","Dry Bones Burnout","DBB","volcano",38.15,18.08],
 ["moo-moo-meadows","Moo Moo Meadows","MMM","plains",49.96,41.98],
 ["choco-mountain","Choco Mountain","CM","plains",37.81,51.47],
 ["toads-factory","Toad's Factory","TF","plains",39.01,35.06],
 ["bowsers-castle","Bowser's Castle","BCa","volcano",26.96,18.64],
 ["acorn-heights","Acorn Heights","AH","forest",49.74,11.33],
 ["mario-circuit","Mario Circuit","MC","forest",50.45,27.58],
 ["peach-stadium","Peach Stadium","PS","plains",50.04,57.37],
 ["rainbow-road","Rainbow Road","RR","sky",49.9,71.5]
].map(a=>({id:a[0],name:a[1],abbr:a[2],biome:a[3],x:a[4]*10,y:a[5]*8.75,alias:a[6]||""}));
const SNES=[
 ["snes-mario-circuit-1","SNES Mario Circuit 1","mario-circuit","mc"],
 ["snes-mario-circuit-2","SNES Mario Circuit 2","mario-circuit","mc"],
 ["snes-mario-circuit-3","SNES Mario Circuit 3","mario-circuit","mc"],
 ["snes-ghost-valley-1","SNES Ghost Valley 1","boo-cinema","gv"],
 ["snes-ghost-valley-2","SNES Ghost Valley 2","boo-cinema","gv"],
 ["snes-ghost-valley-3","SNES Ghost Valley 3","boo-cinema","gv"],
 ["snes-choco-island-1","SNES Choco Island 1","choco-mountain","ci"],
 ["snes-choco-island-2","SNES Choco Island 2","choco-mountain","ci"],
 ["snes-vanilla-lake-1","SNES Vanilla Lake 1","sky-high-sundae","vl"],
 ["snes-koopa-beach-1","SNES Koopa Beach 1","koopa-troopa-beach","kb"]
].map(a=>({id:a[0],name:a[1],host:a[2],theme:a[3]}));
/*ROUTES*/
const T=Object.fromEntries(TRACKS.map(t=>[t.id,t]));
/* Rundenzahl im VS-Rennen: Standard 3 Runden. Ausnahmen = eine lange Runde, in Abschnitte geteilt.
   SNES-Strecken: 5 Runden wie im Original (Angabe aus Wiki-Auszug, nicht doppelt bestätigt). */
const LAPS={"dk-spaceport":[1,6],"mario-circuit":[1,3],"rainbow-road":[1,4]};
const lapText=id=>LAPS[id]?`1 Runde · ${LAPS[id][1]} Abschnitte`:"3 Runden";
const SNES_LAPS="5 Runden";
TRACKS.forEach(t=>{t.cups=CUPS.filter(c=>c.t.includes(t.id));t.order=Math.min(...CUPS.flatMap((c,ci)=>c.t.map((x,i)=>x===t.id?ci*4+i:999)))});

/* ---------- Varianten (alles, was bewertet werden kann) ---------- */
const V=[];const VI={};
function addV(v){V.push(v);VI[v.id]=v}
TRACKS.forEach(t=>addV({id:"main-"+t.id,type:"main",track:t.id,name:t.name,order:t.order}));
SNES.forEach((s,i)=>addV({id:s.id,type:"snes",track:s.host,name:s.name,theme:s.theme,order:100+i}));
const RSET=new Set(ROUTES.map(r=>r[0]+">"+r[1]));
ROUTES.forEach((r,i)=>addV({id:"r-"+r[0]+"--"+r[1],type:"int",from:r[0],to:r[1],track:r[0],sections:r[2],gimmicks:r[3]||[],

function smooth(pts,closed=true){ // Catmull-Rom → Bézier
  const n=pts.length;let d=`M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  const P=i=>closed?pts[(i+n)%n]:pts[Math.max(0,Math.min(n-1,i))];
  for(let i=0;i<(closed?n:n-1);i++){const p0=P(i-1),p1=P(i),p2=P(i+1),p3=P(i+2);
    d+=`C${(p1[0]+(p2[0]-p0[0])/6).toFixed(1)},${(p1[1]+(p2[1]-p0[1])/6).toFixed(1)} ${(p2[0]-(p3[0]-p1[0])/6).toFixed(1)},${(p2[1]-(p3[1]-p1[1])/6).toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`}
  return d+(closed?"Z":"");
}

(function(){
  const svg=$("#map");const pts=new Map();let moved=0,start=null,pinch=null,downMk=null;
  const toSvg=(cx,cy)=>{const r=svg.getBoundingClientRect();return{x:vb.x+(cx-r.left)/r.width*vb.w,y:vb.y+(cy-r.top)/r.height*vb.h}};
  function zoomAt(f,cx,cy){const p=toSvg(cx,cy);const nw=Math.max(180,Math.min(VB0.w*1.6,vb.w*f));const k=nw/vb.w;
    vb={x:p.x-(p.x-vb.x)*k,y:p.y-(p.y-vb.y)*k,w:nw,h:vb.h*k};applyVB()}
  window.zoomAt=zoomAt;
  svg.addEventListener("wheel",e=>{e.preventDefault();zoomAt(e.deltaY>0?1.12:1/1.12,e.clientX,e.clientY)},{passive:false});
  svg.addEventListener("pointerdown",e=>{downMk=e.target.closest(".mk");svg.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;
    start={x:e.clientX,y:e.clientY,vb:{...vb}};if(pts.size===2){const[a,b]=[...pts.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),vb:{...vb}}}});
  svg.addEventListener("pointermove",e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    const r=svg.getBoundingClientRect();
    if(pts.size===2&&pinch){const[a,b]=[...pts.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);vb={...pinch.vb};zoomAt(pinch.d/d,(a.x+b.x)/2,(a.y+b.y)/2);moved=99;return}
    const dx=e.clientX-start.x,dy=e.clientY-start.y;if(Math.abs(dx)+Math.abs(dy)>6){moved=Math.abs(dx)+Math.abs(dy);svg.classList.add("drag")}
    if(moved>6){vb.x=start.vb.x-dx/r.width*vb.w;vb.y=start.vb.y-dy/r.height*vb.h;applyVB()}});
  const up=e=>{pts.delete(e.pointerId);if(pts.size<2)pinch=null;if(pts.size===1){const p=[...pts.values()][0];start={x:p.x,y:p.y,vb:{...vb}}}svg.classList.remove("drag")};
  svg.addEventListener("pointerup",up);svg.addEventListener("pointercancel",up);
  svg.addEventListener("click",e=>{if(moved>6){moved=0;return}const m=downMk||e.target.closest(".mk");downMk=null;if(m)location.hash="strecke-"+m.dataset.id;else if(selTrack)location.hash="karte"});
  svg.addEventListener("keydown",e=>{const m=e.target.closest(".mk");if(m&&(e.key==="Enter"||e.key===" ")){e.preventDefault();location.hash="strecke-"+m.dataset.id}});
  svg.addEventListener("pointerover",e=>{const m=e.target.closest(".mk");if(m&&!selTrack)showConn(m.dataset.id)});
  svg.addEventListener("pointerout",e=>{const m=e.target.closest(".mk");if(m&&!selTrack&&!(e.relatedTarget&&m.contains(e.relatedTarget)))showConn(null)});
  const c=()=>{const r=svg.getBoundingClientRect();return[r.left+r.width/2,r.top+r.height/2]};
  $("#zin").onclick=()=>zoomAt(1/1.35,...c());$("#zout").onclick=()=>zoomAt(1.35,...c());$("#zreset").onclick=fitVB;
  addEventListener("resize",()=>{if(!$("#v-map").hidden)fitVB()});
  setTimeout(()=>{$("#hint").style.opacity=0},5000);
})();

function renderProg(){

  const top=[...rated].sort((a,b)=>get(b.id).r-get(a.id).r||a.order-b.order).slice(0,6);

}

function lastVR(m){const r=rows().filter(x=>x.m===m&&Number.isFinite(x.b));return r.length?r[r.length-1].b:3000}
function statsOf(list){const n=list.length;const pl=list.map(r=>r.p);const dv=list.filter(r=>Number.isFinite(r.a)&&Number.isFinite(r.b)).map(r=>r.b-r.a);
  return{n,avg:n?pl.reduce((a,b)=>a+b,0)/n:NaN,best:n?Math.min(...pl):NaN,wins:pl.filter(x=>x===1).length,top3:n?pl.filter(x=>x<=3).length/n*100:NaN,
    avgN:n?list.reduce((a,r)=>a+(r.n||0),0)/n:NaN,dvSum:dv.reduce((a,b)=>a+b,0),dvAvg:dv.length?dv.reduce((a,b)=>a+b,0)/dv.length:NaN,
    rel:n?list.reduce((a,r)=>a+(r.n>1?(r.p-1)/(r.n-1):0),0)/n:NaN}}
function onlineBox(vid){const l=rows().filter(r=>r.m==="race"&&r.v===vid);const st=statsOf(l);
  return `<div class="box"><h3>Online auf dieser Strecke</h3>${st.n?`<div class="kpis"><div class="kpi"><span class="k">Rennen</span><span class="v">${st.n}</span></div><div class="kpi"><span class="k">Ø Platz</span><span class="v">${fmtN(st.avg)}</span></div><div class="kpi"><span class="k">VR-Bilanz</span><span class="v ${st.dvSum>0?"pos":st.dvSum<0?"neg":""}">${sgn(st.dvSum)}</span></div></div><p style="margin:12px 0 0"><button class="btn primary" data-ostat>Statistik öffnen</button></p>`:`<p class="note-empty">Noch keine Online-Rennen hier eingetragen. Trag sie im Bereich „Online“ ein.</p><button class="btn" data-ostat>Zum Online-Bereich</button>`}</div>`}

/* --- kleine SVG-Diagramme (eine Achse, dünne Linien, Hover-Tooltips) --- */
const CW=640,CH=250,ML=44,MR=14,MT=14,MB=30;
function niceTicks(lo,hi,n=4,int=false){if(lo===hi){lo-=1;hi+=1}const span=hi-lo,step0=span/n,mag=10**Math.floor(Math.log10(step0));let step=[1,2,2.5,5,10].map(k=>k*mag).find(k=>span/k<=n)||10*mag;if(int)step=Math.max(1,Math.round(step));
  const t=[];for(let v=Math.ceil(lo/step)*step;v<=hi+1e-9;v+=step)t.push(+v.toFixed(6));return{t,lo:Math.min(lo,t[0]),hi:Math.max(hi,t[t.length-1])}}
function frame(yt,ymap,n,xlab){const W=CW-ML-MR;let g=yt.map(v=>`<line class="grid" x1="${ML}" x2="${CW-MR}" y1="${ymap(v)}" y2="${ymap(v)}"/><text class="ax" x="${ML-8}" y="${ymap(v)+4}" text-anchor="end">${String(v).replace(".",",")}</text>`).join("");
  const xs=n<=1?[1]:[...new Set([1,Math.round(n/3),Math.round(2*n/3),n].filter(x=>x>=1))];
  g+=xs.map(i=>`<text class="ax" x="${ML+(n<=1?W/2:(i-1)/(n-1)*W)}" y="${CH-8}" text-anchor="middle">${i}</text>`).join("");
  return g}
const xAt=(i,n)=>ML+(n<=1?(CW-ML-MR)/2:i/(n-1)*(CW-ML-MR));
function emptyChart(msg){return `<svg viewBox="0 0 ${CW} 120"><text class="empty" x="${CW/2}" y="64" text-anchor="middle">${msg}</text></svg>`}
function lineChart(vals,tips,{invert=false,fixed=null,color="#2b78c9",avg=null}={}){
  const n=vals.length;if(!n)return emptyChart("Noch keine Daten");
  let lo=fixed?fixed[0]:Math.min(...vals),hi=fixed?fixed[1]:Math.max(...vals);const nt=niceTicks(lo,hi);if(!fixed){lo=nt.lo;hi=nt.hi}
  const ymap=v=>invert?MT+(v-lo)/(hi-lo)*(CH-MT-MB):CH-MB-(v-lo)/(hi-lo)*(CH-MT-MB);
  const pts=vals.map((v,i)=>[xAt(i,n),ymap(v)]);const path=pts.map((q,i)=>(i?"L":"M")+q[0].toFixed(1)+","+q[1].toFixed(1)).join("");
  const av=avg?avg.map((v,i)=>(i?"L":"M")+xAt(i,n).toFixed(1)+","+ymap(v).toFixed(1)).join(""):"";
  const last=pts[n-1];const hitW=Math.max(8,(CW-ML-MR)/Math.max(1,n));
  return `<svg viewBox="0 0 ${CW} ${CH}" role="img">${frame(nt.t.filter(t=>t>=lo&&t<=hi),ymap,n,"Rennen")}
   ${avg?`<path d="${av}" fill="none" stroke="#ffb000" stroke-width="3" stroke-linejoin="round"/>`:""}
   <path d="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" opacity="${avg?.55:1}"/>
   ${n<=60?pts.map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="4" fill="${color}" stroke="var(--card)" stroke-width="2"/>`).join(""):""}
   <circle cx="${last[0]}" cy="${last[1]}" r="6" fill="${color}" stroke="var(--card)" stroke-width="2"/>
   ${pts.map((q,i)=>`<rect class="hit" x="${q[0]-hitW/2}" y="${MT}" width="${hitW}" height="${CH-MT-MB}" data-tip="${esc(tips[i])}"/>`).join("")}</svg>`}
function barChart(vals,tips,{diverge=false,labels=null,color="#2b78c9",xlab="Rennen"}={}){
  const n=vals.length;if(!n||vals.every(v=>v===0)&&!labels)return emptyChart("Noch keine Daten");
  let lo=diverge?Math.min(0,...vals):0,hi=Math.max(diverge?0:1,...vals);const nt=niceTicks(lo,hi,4,true);lo=nt.lo;hi=nt.hi;
  const ymap=v=>CH-MB-(v-lo)/(hi-lo)*(CH-MT-MB);const W=CW-ML-MR,bw=W/n,gap=Math.min(2,bw*.2);
  let g=nt.t.map(v=>`<line class="grid" x1="${ML}" x2="${CW-MR}" y1="${ymap(v)}" y2="${ymap(v)}"/><text class="ax" x="${ML-8}" y="${ymap(v)+4}" text-anchor="end">${v}</text>`).join("");
  g+=vals.map((v,i)=>{const x=ML+i*bw+gap/2,w=Math.max(1,bw-gap),y0=ymap(0),y1=ymap(v);const c=diverge?(v>=0?"#1f9d55":"#e3262f"):color;
    return `<rect x="${x.toFixed(1)}" y="${Math.min(y0,y1).toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(v===0?0:1,Math.abs(y1-y0)).toFixed(1)}" rx="${Math.min(4,w/2)}" fill="${c}"/><rect class="hit" x="${(ML+i*bw).toFixed(1)}" y="${MT}" width="${bw.toFixed(1)}" height="${CH-MT-MB}" data-tip="${esc(tips[i])}"/>`}).join("");
  g+=`<line class="base" x1="${ML}" x2="${CW-MR}" y1="${ymap(0)}" y2="${ymap(0)}"/>`;
  if(labels)g+=labels.map((l,i)=>l?`<text class="ax" x="${(ML+(i+.5)*bw).toFixed(1)}" y="${CH-8}" text-anchor="middle">${l}</text>`:"").join("");
  else{const xs=n<=1?[1]:[...new Set([1,Math.round(n/2),n])];g+=xs.map(i=>`<text class="ax" x="${(ML+(i-.5)*bw).toFixed(1)}" y="${CH-8}" text-anchor="middle">${i}</text>`).join("")}
  return `<svg viewBox="0 0 ${CW} ${CH}" role="img">${g}<text class="ax" x="${CW-MR}" y="${MT-2}" text-anchor="end" style="font-weight:700">${xlab}</text></svg>`}

        <label>Fahrer im Rennen<input id="o-n" type="number" min="2" max="24" inputmode="numeric" value="${dr.n??(m==="ko"?24:24)}"></label>

        <label>Änderung<span class="delta" id="o-d">–</span></label>
        <label>Datum &amp; Uhrzeit<input id="o-t" type="datetime-local"></label>
      </div>
      <div class="actions" style="margin-top:14px"><button class="btn primary" type="submit">Ergebnis speichern</button><span class="msg" id="o-msg" role="status"></span></div>
    </form>
    <div class="scope"><label for="o-scope" class="sec-t" style="margin:0">Auswertung</label>
      <select id="o-scope"><option value="all">Gesamt (${all.length} ${m==="race"?"Rennen":"Touren"})</option>${keys.map(k=>`<option value="${esc(k)}" ${OST.scope===k?"selected":""}>${esc(scopeName(m,k))}</option>`).join("")}</select>
      ${OST.scope!=="all"&&m==="race"&&VI[OST.scope]?`<a class="btn" href="#v-${OST.scope}">Strecke öffnen</a>`:""}</div>
    <div class="kpis">
      <div class="kpi"><span class="k">${m==="race"?"Rennen":"Touren"}</span><span class="v">${st.n}</span><span class="s">Ø ${fmtN(st.avgN)} Fahrer</span></div>
      <div class="kpi"><span class="k">Ø Platzierung</span><span class="v">${fmtN(st.avg)}</span><span class="s">Bester Platz: ${Number.isFinite(st.best)?st.best:"–"}</span></div>
      <div class="kpi"><span class="k">Siege</span><span class="v">${st.wins}</span><span class="s">Top 3: ${fmtN(st.top3,0)} %</span></div>
      <div class="kpi"><span class="k">Feld geschlagen</span><span class="v">${Number.isFinite(st.rel)?fmtN((1-st.rel)*100,0)+" %":"–"}</span><span class="s">Anteil Fahrer hinter dir</span></div>
      <div class="kpi"><span class="k">VR aktuell</span><span class="v">${lastVR(m)}</span><span class="s">${OST.scope==="all"?"letzter Eintrag":"Gesamtstand"}</span></div>
      <div class="kpi"><span class="k">VR-Bilanz</span><span class="v ${st.dvSum>0?"pos":st.dvSum<0?"neg":""}">${sgn(st.dvSum)}</span><span class="s">Ø ${Number.isFinite(st.dvAvg)?sgn(Math.round(st.dvAvg)):"–"} pro ${m==="race"?"Rennen":"Tour"}</span></div>

      <div class="box chart"><h3>Platzverteilung</h3><p class="sub">Wie oft du welchen Platz belegt hast</p>${series.length?barChart(hist,hist.map((c,i)=>`Platz ${i+1}: ${c}×`),{labels:hist.map((_,i)=>[1,4,8,12,16,20,24].includes(i+1)?i+1:""),color:"#2b78c9",xlab:"Anzahl"}):emptyChart("Noch keine Daten")}</div>

      ${per.map(x=>`<tr data-scope="${esc(x.k)}"><td><span class="nm">${m==="race"&&VI[x.k]?emblem(VI[x.k].type,24):""}${esc(scopeName(m,x.k))}</span></td><td>${x.n}</td><td>${fmtN(x.avg)}</td><td>${x.wins}</td><td>${x.best}</td><td class="${x.dvSum>0?"pos":x.dvSum<0?"neg":""}">${sgn(x.dvSum)}</td><td>${Number.isFinite(x.dvAvg)?sgn(Math.round(x.dvAvg)):"–"}</td></tr>`).join("")}
      </tbody></table></div><p class="sync" style="margin:8px 0 0">Spaltenkopf antippen zum Sortieren, Zeile antippen für die Einzelauswertung.</p>`:`<p class="note-empty">Sobald du Ergebnisse einträgst, siehst du hier jede ${m==="race"?"Strecke":"Rallye"} im Vergleich.</p>`}</div>`:""}
    <div class="box"><h3>Letzte Ergebnisse</h3><div class="olist">${recent.map(r=>`<div class="orow"><span class="place">${r.p}<small>/${r.n}</small></span><span>${esc(scopeName(r.m,r.v))}<br><small>${dstr(r.d)}</small></span><span class="${Number.isFinite(r.b)?(r.b-r.a>0?"pos":r.b-r.a<0?"neg":""):""}" style="font-weight:800">${Number.isFinite(r.b)?sgn(r.b-r.a)+" VR":"–"}</span><button class="del ${OST.armed===r.id?"arm":""}" data-del="${r.id}">${OST.armed===r.id?"Wirklich löschen?":"Löschen"}</button></div>`).join("")||`<p class="note-empty">Noch keine Ergebnisse eingetragen.</p>`}</div></div>

  const now=new Date();now.setMinutes(now.getMinutes()-now.getTimezoneOffset());$("#o-t").value=now.toISOString().slice(0,16);
  if(dr.v)$("#o-v").value=dr.v;else if(m==="race"&&OST.scope!=="all"&&VI[OST.scope])$("#o-v").value=OST.scope;

function paintDelta(){const a=+$("#o-a").value,bs=$("#o-b").value;const el=$("#o-d");if(!el)return;if(bs===""||!Number.isFinite(a)){el.textContent="–";el.className="delta";return}
  const d=+bs-a;el.textContent=sgn(d);el.className="delta "+(d>0?"pos":d<0?"neg":"")}
$("#v-online").addEventListener("input",e=>{if(e.target.id==="o-a"||e.target.id==="o-b")paintDelta()});
$("#v-online").addEventListener("change",e=>{if(e.target.id==="o-scope"){OST.scope=e.target.value;renderOnline()}});
$("#v-online").addEventListener("click",e=>{
  const mb=e.target.closest("[data-om] button");if(mb){OST.mode=mb.dataset.v;OST.scope="all";OST.draft={};renderOnline();return}
  const th=e.target.closest("th[data-sort]");if(th){OST.sort=th.dataset.sort;renderOnline();return}
  const tr=e.target.closest("tr[data-scope]");if(tr){OST.scope=tr.dataset.scope;renderOnline();$("#v-online").scrollTop=0;return}
  const del=e.target.closest("[data-del]");if(del){const id=del.dataset.del;if(OST.armed===id){O[id]={del:1,t:Date.now()};saveO();queue(id);OST.armed=null}else OST.armed=id;renderOnline()}
});
$("#v-online").addEventListener("submit",e=>{e.preventDefault();const m=OST.mode;
  const v=($("#o-v").value||"").trim(),p=+$("#o-p").value,n=+$("#o-n").value,a=$("#o-a").value===""?NaN:+$("#o-a").value,bs=$("#o-b").value,b=bs===""?NaN:+bs;
  const msg=t=>{$("#o-msg").textContent=t;$("#o-msg").className="msg neg"};
  if(!v)return msg(m==="race"?"Bitte eine Strecke wählen.":"Bitte eine Rallye angeben.");
  if(!(n>=2&&n<=24))return msg("Die Fahrerzahl muss zwischen 2 und 24 liegen.");
  if(!(p>=1&&p<=n&&Number.isInteger(p)))return msg(`Die Platzierung muss zwischen 1 und ${n||24} liegen.`);
  if(Number.isFinite(b)&&!Number.isFinite(a))return msg("Bitte auch das VR vorher eintragen.");
  const tv=$("#o-t").value?new Date($("#o-t").value).getTime():Date.now();
  const id="o-"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  putO(id,{m,v,p,n,a:Number.isFinite(a)?a:null,b:Number.isFinite(b)?b:null,d:tv});
  OST.draft={v,n};renderOnline();$("#o-msg").textContent=`Gespeichert: Platz ${p} von ${n}${Number.isFinite(b)?` · ${sgn(b-a)} VR`:""}.`;$("#o-msg").className="msg pos";
});
/* Tooltip für alle Diagramme */
document.addEventListener("pointermove",e=>{const h=e.target.closest&&e.target.closest("[data-tip]");const tip=$("#tip");
  if(!h){tip.hidden=true;return}tip.textContent=h.dataset.tip;tip.hidden=false;const w=tip.offsetWidth,hh=tip.offsetHeight;
  let x=e.clientX+14,y=e.clientY-hh-10;if(x+w>innerWidth-8)x=e.clientX-w-14;if(y<8)y=e.clientY+16;tip.style.left=x+"px";tip.style.top=y+"px"});

(function(){
  const q=$("#q"),box=$("#sres");let hits=[],sel=0;
  function show(){const s=q.value.trim();if(!s){box.hidden=true;return}
    const tr=TRACKS.filter(t=>matches({name:t.name,track:t.id,type:"main"},s)).map(t=>({go:"strecke-"+t.id,lab:t.name,pill:"main",sub:"Strecke auf der Karte"}));
    const vs=V.filter(v=>v.type!=="main"&&matches(v,s)).slice(0,12).map(v=>({go:"v-"+v.id,lab:v.name,pill:v.type,sub:v.type==="int"?v.sections+" Abschnitte":"über "+T[v.track].name}));
    hits=[...tr,...vs].slice(0,14);sel=0;
    box.innerHTML=hits.map((h,i)=>`<button data-i="${i}" class="${i===0?"on":""}">${typePill(h.pill)}<span style="flex:1;min-width:0"><b>${esc(h.lab)}</b><br><small style="color:var(--ink-soft)">${esc(h.sub)}</small></span></button>`).join("")||`<div class="empty">Nichts gefunden.</div>`;box.hidden=false}
  const pick=i=>{if(!hits[i])return;location.hash=hits[i].go;q.value="";box.hidden=true;q.blur()};
  q.addEventListener("input",show);q.addEventListener("focus",show);
  q.addEventListener("keydown",e=>{if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();sel=(sel+(e.key==="ArrowDown"?1:-1)+hits.length)%Math.max(1,hits.length);box.querySelectorAll("button").forEach((b,i)=>b.classList.toggle("on",i===sel))}
    else if(e.key==="Enter"){e.preventDefault();pick(sel)}else if(e.key==="Escape"){box.hidden=true;q.blur()}});
  box.addEventListener("mousedown",e=>{const b=e.target.closest("[data-i]");if(b){e.preventDefault();pick(+b.dataset.i)}});
  q.addEventListener("blur",()=>setTimeout(()=>box.hidden=true,150));
})();

let mapReady=false;
function route(){
  const h=decodeURIComponent(location.hash.slice(1));
  if(h.startsWith("v-")){show("v-detail");renderDetail(h.slice(2));return}
  if(h==="alle"){show("v-all");renderAll();return}
  if(h==="fortschritt"){show("v-prog");renderProg();return}
  if(h==="online"){show("v-online");renderOnline();return}
  show("v-map");
  if(!mapReady){renderMap();mapReady=true;requestAnimationFrame(fitVB)}else updateMarkers();
  const id=h.startsWith("strecke-")?h.slice(8):null;
  if(id&&T[id]){if(selTrack!==id)panelTab=outOf(id).length?"out":"in";selTrack=id;renderPanel(id);$("#panel").classList.add("open");markSel(id)}
  else{selTrack=null;$("#panel").classList.remove("open");markSel(null);showConn(null)}
}
addEventListener("hashchange",route);
addEventListener("keydown",e=>{if(e.key==="Escape"&&selTrack&&document.activeElement.tagName!=="INPUT")location.hash="karte"});
refreshBadges();route();initCloud();
</script>
